<script>

/* ============================================================
   只要填這兩個
============================================================ */

const SUPABASE_URL =
    "https://rjdgnqyonhtxhprxoxqg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_tvelWVMJ7VRunLHxu2OJ8Q_2thAk1Wa";


/* ============================================================
   Supabase
============================================================ */

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ============================================================
   State
============================================================ */

let editor;

let currentProblemIndex = 0;

let editingProblemIndex = null;

let testCases = [];

let codeSaveTimer = null;



/* ============================================================
   內建題目
============================================================ */

const builtinProblems = [

    {
        id: "builtin_1",

        title:
            "Hello World 與雙倍數",

        tag:
            "入門",

        url:
            "",

        description:
            "輸入一個整數 N，輸出 N 的兩倍",

        tip:
            "使用 cin 讀入，使用 cout 輸出",

        code:
`#include <iostream>
using namespace std;

int main() {
    int n;

    cin >> n;

    cout << n * 2 << endl;

    return 0;
}`,

        testcases: [
            {
                input:
                    "5",

                expected:
                    "10"
            }
        ]
    },


    {
        id:
            "builtin_2",

        title:
            "三角形判斷",

        tag:
            "條件判斷",

        url:
            "",

        description:
            "輸入 a、b、c，判斷 a²+b² 是否等於 c²",

        tip:
            "使用 if / else",

        code:
`#include <iostream>
using namespace std;

int main() {
    int a, b, c;

    cin >> a >> b >> c;

    if (a * a + b * b == c * c) {
        cout << "Right Triangle" << endl;
    } else {
        cout << "Not Right Triangle" << endl;
    }

    return 0;
}`,

        testcases: [
            {
                input:
                    "3 4 5",

                expected:
                    "Right Triangle"
            }
        ]
    }

];


let problems = [
    ...builtinProblems
];



/* ============================================================
   Auth
============================================================ */

async function getUser() {

    const {
        data: sessionData,
        error: sessionError
    } =
        await db.auth.getSession();


    if (sessionError) {
        throw sessionError;
    }


    if (sessionData.session) {

        return sessionData.session.user;

    }


    const {
        data,
        error
    } =
        await db.auth.signInAnonymously();


    if (error) {
        throw error;
    }


    return data.user;
}



/* ============================================================
   Database Row
============================================================ */

function databaseToProblem(row) {

    return {

        id:
            "custom_" + row.id,

        dbId:
            row.id,

        title:
            row.title,

        tag:
            "我的題目",

        url:
            row.source_url || "",

        description:
            row.description || "",

        tip:
            row.tip || "",

        code:
            row.code || defaultCode(),

        testcases:
            Array.isArray(
                row.testcases
            )
                ? row.testcases
                : []

    };

}



function defaultCode() {

    return `#include <iostream>
using namespace std;

int main() {

    return 0;
}`;

}



/* ============================================================
   SELECT
============================================================ */

async function loadProblems() {

    const user =
        await getUser();


    const {
        data,
        error
    } =
        await db
            .from("problems")
            .select("*")
            .eq(
                "user_id",
                user.id
            )
            .order(
                "created_at",
                {
                    ascending:
                        false
                }
            );


    if (error) {
        throw error;
    }


    problems = [

        ...(data || [])
            .map(
                databaseToProblem
            ),

        ...builtinProblems

    ];

}



/* ============================================================
   INSERT / UPDATE
============================================================ */

async function saveProblem() {

    const title =
        document
            .getElementById(
                "inputTitle"
            )
            .value
            .trim();


    const url =
        document
            .getElementById(
                "inputUrl"
            )
            .value
            .trim();


    const description =
        document
            .getElementById(
                "inputDescription"
            )
            .value
            .trim();


    const tip =
        document
            .getElementById(
                "inputTip"
            )
            .value
            .trim();


    if (!title) {

        toast(
            "請輸入題目名稱"
        );

        return;

    }


    const button =
        document.getElementById(
            "saveProblemButton"
        );


    button.disabled =
        true;


    button.innerText =
        "儲存中";


    try {

        const user =
            await getUser();


        /*
            UPDATE
        */

        if (
            editingProblemIndex !==
            null
        ) {

            const problem =
                problems[
                    editingProblemIndex
                ];


            if (!problem?.dbId) {

                throw new Error(
                    "內建題目不能修改"
                );

            }


            let code =
                problem.code;


            if (
                editingProblemIndex ===
                currentProblemIndex &&
                editor
            ) {

                code =
                    editor.getValue();

            }


            const {
                data,
                error
            } =
                await db
                    .from(
                        "problems"
                    )
                    .update({

                        title:
                            title,

                        source_url:
                            url || null,

                        description:
                            description,

                        tip:
                            tip,

                        code:
                            code,

                        testcases:
                            problem.testcases || []

                    })
                    .eq(
                        "id",
                        problem.dbId
                    )
                    .eq(
                        "user_id",
                        user.id
                    )
                    .select()
                    .single();


            if (error) {
                throw error;
            }


            problems[
                editingProblemIndex
            ] =
                databaseToProblem(
                    data
                );


            toast(
                "題目已更新"
            );

        }


        /*
            INSERT
        */

        else {

            const {
                data,
                error
            } =
                await db
                    .from(
                        "problems"
                    )
                    .insert({

                        user_id:
                            user.id,

                        title:
                            title,

                        source_url:
                            url || null,

                        description:
                            description,

                        tip:
                            tip,

                        code:
                            defaultCode(),

                        testcases:
                            []

                    })
                    .select()
                    .single();


            if (error) {
                throw error;
            }


            problems.unshift(
                databaseToProblem(
                    data
                )
            );


            currentProblemIndex =
                0;


            loadProblem(
                0
            );


            toast(
                "題目已儲存"
            );

        }


        closeProblemModal();

        renderProblems();


    } catch (error) {

        console.error(
            error
        );


        toast(
            "儲存失敗"
        );


    } finally {

        button.disabled =
            false;

        button.innerText =
            "儲存";

    }

}



/* ============================================================
   DELETE
============================================================ */

async function deleteProblem(
    event,
    index
) {

    event.stopPropagation();


    const problem =
        problems[index];


    if (!problem?.dbId) {

        toast(
            "內建題目不能刪除"
        );

        return;

    }


    if (
        !confirm(
            "確定刪除這個題目？"
        )
    ) {

        return;

    }


    try {

        const user =
            await getUser();


        const {
            error
        } =
            await db
                .from(
                    "problems"
                )
                .delete()
                .eq(
                    "id",
                    problem.dbId
                )
                .eq(
                    "user_id",
                    user.id
                );


        if (error) {
            throw error;
        }


        problems.splice(
            index,
            1
        );


        currentProblemIndex =
            Math.min(
                currentProblemIndex,
                problems.length - 1
            );


        loadProblem(
            currentProblemIndex
        );


        toast(
            "題目已刪除"
        );


    } catch (error) {

        console.error(
            error
        );


        toast(
            "刪除失敗"
        );

    }

}



/* ============================================================
   Code 自動儲存
============================================================ */

async function saveCode() {

    const problem =
        problems[
            currentProblemIndex
        ];


    if (
        !problem?.dbId ||
        !editor
    ) {

        return;

    }


    problem.code =
        editor.getValue();


    const {
        error
    } =
        await db
            .from(
                "problems"
            )
            .update({

                code:
                    problem.code

            })
            .eq(
                "id",
                problem.dbId
            );


    if (error) {

        console.error(
            "自動儲存失敗",
            error
        );

    }

}



/* ============================================================
   Testcase SAVE
============================================================ */

async function saveTests() {

    const problem =
        problems[
            currentProblemIndex
        ];


    if (!problem) {
        return;
    }


    problem.testcases =
        testCases.map(
            test => ({

                input:
                    test.input || "",

                expected:
                    test.expected || ""

            })
        );


    if (!problem.dbId) {
        return;
    }


    const {
        error
    } =
        await db
            .from(
                "problems"
            )
            .update({

                testcases:
                    problem.testcases

            })
            .eq(
                "id",
                problem.dbId
            );


    if (error) {

        console.error(
            error
        );

    }

}



/* ============================================================
   UI INIT
============================================================ */

window.addEventListener(
    "load",
    async function () {

        try {

            await loadProblems();


            const status =
                document.getElementById(
                    "dbStatus"
                );


            status.innerText =
                "雲端資料庫已連線";


            status.className =
                "text-[10px] text-emerald-400 border border-emerald-500/30 rounded-full px-2 py-1";


        } catch (error) {

            console.error(
                error
            );


            document
                .getElementById(
                    "dbStatus"
                )
                .innerText =
                "資料庫連線失敗";

        }


        require.config({

            paths: {

                vs:
                    "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs"

            }

        });


        require(
            [
                "vs/editor/editor.main"
            ],

            function () {

                editor =
                    monaco.editor.create(

                        document.getElementById(
                            "editor"
                        ),

                        {

                            value:
                                problems[0]?.code ||
                                defaultCode(),

                            language:
                                "cpp",

                            theme:
                                "vs-dark",

                            fontSize:
                                getSavedFontSize(),

                            automaticLayout:
                                true,

                            minimap: {
                                enabled:
                                    true
                            },

                            scrollBeyondLastLine:
                                false

                        }

                    );


                editor.onDidChangeModelContent(
                    function () {

                        clearTimeout(
                            codeSaveTimer
                        );


                        codeSaveTimer =
                            setTimeout(
                                saveCode,
                                1000
                            );

                    }
                );


                renderProblems();

                loadProblem(
                    0
                );

            }

        );

    }
);



/* ============================================================
   Problems UI
============================================================ */

function renderProblems() {

    const container =
        document.getElementById(
            "problemPanel"
        );


    container.innerHTML =
        "";


    problems.forEach(
        function (
            problem,
            index
        ) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "relative border border-slate-800 bg-slate-800/30 rounded-lg p-3 cursor-pointer hover:bg-slate-800 " +
                (
                    index ===
                    currentProblemIndex
                        ? "problem-active"
                        : ""
                );


            item.onclick =
                function () {

                    loadProblem(
                        index
                    );

                };


            const canEdit =
                !!problem.dbId;


            item.innerHTML = `

                <div class="pr-14">

                    <div
                        class="text-xs font-bold truncate"
                    >
                        ${escapeHtml(problem.title)}
                    </div>

                    <div
                        class="text-[10px] text-emerald-400 mt-1"
                    >
                        ${escapeHtml(problem.tag)}
                    </div>

                </div>


                ${
                    canEdit
                        ? `

                        <div
                            class="absolute top-2 right-2 flex gap-1"
                        >

                            <button
                                onclick="editProblem(event, ${index})"
                                class="text-slate-400 hover:text-amber-400"
                            >
                                <i
                                    class="fa-solid fa-pen"
                                ></i>
                            </button>


                            <button
                                onclick="deleteProblem(event, ${index})"
                                class="text-slate-400 hover:text-rose-400"
                            >
                                <i
                                    class="fa-solid fa-trash"
                                ></i>
                            </button>

                        </div>

                        `
                        : ""
                }

            `;


            container.appendChild(
                item
            );

        }
    );

}



/* ============================================================
   Load Problem
============================================================ */

function loadProblem(index) {

    if (
        index < 0 ||
        !problems[index]
    ) {

        return;

    }


    currentProblemIndex =
        index;


    const problem =
        problems[index];


    editor?.setValue(
        problem.code ||
        defaultCode()
    );


    document
        .getElementById(
            "problemTitle"
        )
        .innerText =
        problem.title;


    document
        .getElementById(
            "problemTag"
        )
        .innerText =
        problem.tag;


    document
        .getElementById(
            "problemDescription"
        )
        .innerText =
        problem.description ||
        "無題目敘述";


    document
        .getElementById(
            "problemTip"
        )
        .innerText =
        problem.tip ||
        "無提示";


    const url =
        document.getElementById(
            "problemUrl"
        );


    if (problem.url) {

        url.href =
            problem.url;

        url.classList.remove(
            "hidden"
        );

    } else {

        url.classList.add(
            "hidden"
        );

    }


    testCases =
        (
            problem.testcases ||
            []
        )
            .map(
                test => ({

                    input:
                        test.input || "",

                    expected:
                        test.expected || ""

                })
            );


    renderSamples();

    renderTests();

    renderProblems();

}

/* ============================================================
   C++ Piston
============================================================ */

async function executeCpp(
    code,
    stdin
) {

    const response =
        await fetch(
            "https://emkc.org/api/v2/piston/execute",

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        language:
                            "cpp",

                        version:
                            "*",

                        files: [

                            {

                                name:
                                    "main.cpp",

                                content:
                                    code

                            }

                        ],

                        stdin:
                            stdin || ""

                    })

            }
        );


    if (!response.ok) {

        throw new Error(
            "Compiler unavailable"
        );

    }


    const data =
        await response.json();


    if (
        data.compile &&
        data.compile.code !== 0
    ) {

        return {

            ok:
                false,

            output:
                data.compile.output ||
                data.compile.stderr ||
                "Compile Error"

        };

    }


    return {

        ok:
            data.run?.code === 0,

        output:
            (
                data.run?.stdout ||
                ""
            ) +
            (
                data.run?.stderr
                    ? "\n" +
                      data.run.stderr
                    : ""
            )

    };

}



/* ============================================================
   Run
============================================================ */

async function runCode() {

    switchRightTab(
        "output"
    );


    const output =
        document.getElementById(
            "output"
        );


    output.innerText =
        "執行中...";


    try {

        const result =
            await executeCpp(

                editor.getValue(),

                document
                    .getElementById(
                        "stdin"
                    )
                    .value

            );


        output.innerText =
            result.output ||
            "(沒有輸出)";


    } catch (error) {

        console.error(
            error
        );


        output.innerText =
            "執行失敗";

    }

}



/* ============================================================
   Test Cases
============================================================ */

function renderTests() {

    const container =
        document.getElementById(
            "testContainer"
        );


    container.innerHTML =
        "";


    if (!testCases.length) {

        container.innerHTML =
            '<div class="text-xs text-slate-500">沒有測資</div>';

        return;

    }


    testCases.forEach(
        function (
            test,
            index
        ) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs";


            card.innerHTML = `

                <div
                    class="flex justify-between mb-2"
                >

                    <span>
                        Test #${index + 1}
                    </span>


                    <div class="flex gap-2">

                        <button
                            onclick="runTest(${index})"
                            class="text-emerald-400"
                        >
                            ▶
                        </button>


                        <button
                            onclick="removeTest(${index})"
                            class="text-rose-400"
                        >
                            ✕
                        </button>

                    </div>

                </div>


                <label
                    class="text-[10px] text-slate-500"
                >
                    Input
                </label>

                <textarea
                    rows="2"
                    oninput="changeTest(${index}, 'input', this.value)"
                    class="w-full bg-slate-900
                           border border-slate-800
                           rounded p-2 mb-2
                           font-mono"
                >${escapeHtml(test.input)}</textarea>


                <label
                    class="text-[10px] text-slate-500"
                >
                    Expected
                </label>

                <textarea
                    rows="2"
                    oninput="changeTest(${index}, 'expected', this.value)"
                    class="w-full bg-slate-900
                           border border-slate-800
                           rounded p-2
                           font-mono"
                >${escapeHtml(test.expected)}</textarea>


                ${
                    test.status
                        ? `

                        <div
                            class="mt-2 font-bold ${
                                test.status ===
                                "AC"
                                    ? "text-emerald-400"
                                    : "text-rose-400"
                            }"
                        >
                            ${test.status}
                        </div>

                        `
                        : ""
                }

            `;


            container.appendChild(
                card
            );

        }
    );

}



function addTestCase() {

    testCases.push({

        input:
            "",

        expected:
            ""

    });


    renderTests();

    renderSamples();

    saveTests();

}



function removeTest(index) {

    testCases.splice(
        index,
        1
    );


    renderTests();

    renderSamples();

    saveTests();

}



function changeTest(
    index,
    field,
    value
) {

    testCases[index][field] =
        value;


    renderSamples();


    clearTimeout(
        window.testSaveTimer
    );


    window.testSaveTimer =
        setTimeout(
            saveTests,
            500
        );

}



async function runTest(index) {

    const test =
        testCases[index];


    const result =
        await executeCpp(
            editor.getValue(),
            test.input
        );


    const actual =
        normalize(
            result.output
        );


    const expected =
        normalize(
            test.expected
        );


    test.status =
        actual === expected
            ? "AC"
            : "WA";


    renderTests();

}



async function runAllTests() {

    for (
        let i = 0;
        i < testCases.length;
        i++
    ) {

        await runTest(
            i
        );

    }


    const allAc =
        testCases.length > 0 &&
        testCases.every(
            test =>
                test.status ===
                "AC"
        );


    if (allAc) {

        confetti({

            particleCount:
                100,

            spread:
                70

        });

    }

}



/* ============================================================
   Tabs
============================================================ */

function switchLeftTab(tab) {

    const problem =
        document.getElementById(
            "problemPanel"
        );


    const setting =
        document.getElementById(
            "settingPanel"
        );


    const problemTab =
        document.getElementById(
            "problemTab"
        );


    const settingTab =
        document.getElementById(
            "settingTab"
        );


    if (
        tab ===
        "problems"
    ) {

        problem.classList.remove(
            "hidden"
        );

        setting.classList.add(
            "hidden"
        );

        problemTab.classList.add(
            "tab-active"
        );

        settingTab.classList.remove(
            "tab-active"
        );

    } else {

        setting.classList.remove(
            "hidden"
        );

        problem.classList.add(
            "hidden"
        );

        settingTab.classList.add(
            "tab-active"
        );

        problemTab.classList.remove(
            "tab-active"
        );

    }

}



function switchRightTab(tab) {

    const outputPanel =
        document.getElementById(
            "outputPanel"
        );


    const testPanel =
        document.getElementById(
            "testPanel"
        );


    const outputTab =
        document.getElementById(
            "outputTab"
        );


    const testTab =
        document.getElementById(
            "testTab"
        );


    if (
        tab ===
        "output"
    ) {

        outputPanel.classList.remove(
            "hidden"
        );

        testPanel.classList.add(
            "hidden"
        );

        outputTab.classList.add(
            "tab-active"
        );

        testTab.classList.remove(
            "tab-active"
        );

    } else {

        testPanel.classList.remove(
            "hidden"
        );

        outputPanel.classList.add(
            "hidden"
        );

        testTab.classList.add(
            "tab-active"
        );

        outputTab.classList.remove(
            "tab-active"
        );

    }

}

function changeFontSize(value) {

    const size =
        parseInt(
            value,
            10
        );


    editor?.updateOptions({

        fontSize:
            size

    });


    localStorage.setItem(
        "onlinecpp_font_size",
        String(size)
    );

}



function getSavedFontSize() {

    return parseInt(

        localStorage.getItem(
            "onlinecpp_font_size"
        ) || "14",

        10

    );

}



/* ============================================================
   Download
============================================================ */

function downloadCode() {

    if (!editor) {
        return;
    }


    const blob =
        new Blob(

            [
                editor.getValue()
            ],

            {
                type:
                    "text/plain"
            }

        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        "solution.cpp";


    a.click();


    URL.revokeObjectURL(
        url
    );

}



/* ============================================================
   Utils
============================================================ */

function normalize(value) {

    return String(
        value || ""
    )
        .replace(
            /\r\n/g,
            "\n"
        )
        .trim();

}



function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}



function toast(message) {

    const element =
        document.getElementById(
            "toast"
        );


    element.innerText =
        message;


    element.classList.remove(
        "opacity-0"
    );


    setTimeout(
        function () {

            element.classList.add(
                "opacity-0"
            );

        },
        2200
    );

}
